[pytest]
testpaths = tests
asyncio_mode = auto
# Starlette 1.x warns on TestClient import that httpx2 is preferred. It is
# benign and outside our control on this stack, so it is ignored BY NAME. [C-7]
#
# This used to be a blanket `ignore::DeprecationWarning`, which was wrong in
# both directions at once: it hid every other DeprecationWarning in the project,
# and it never matched the warning its own comment named —
# starlette.exceptions.StarletteDeprecationWarning subclasses UserWarning, not
# DeprecationWarning, so the warning it was written for was displayed on every
# run regardless. (The comment also said "do not let it error the suite";
# nothing here sets -W error, so it could not have.)
filterwarnings =
    ignore:Using `httpx` with `starlette\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
