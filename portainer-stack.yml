# RetroShelf — paste-into-Portainer stack (pulls a pre-built image, no build).
#
# This is the easy path for Portainer's "Add stack → Web editor": it pulls the
# published image from GHCR, so there is no build step. Set the values below in
# Portainer's "Environment variables" section (or edit the defaults inline).
#
# ── Prerequisites ────────────────────────────────────────────────────────────
# 1. The image must be published & public (the docker-publish.yml GitHub Action
#    pushes ghcr.io/caleb68864/retroshelf:latest on every push to main; make the
#    package Public once — see that workflow's header). If you keep it private,
#    add GHCR registry credentials in Portainer → Registries instead.
# 2. RetroShelf must reach Kavita over Docker's network. Set KAVITA_NETWORK to
#    the network your Kavita stack created (find it with `docker network ls`),
#    and use Kavita's *internal* port + service name in KAVITA_OPDS_URL
#    (e.g. http://kavita:5000/api/opds/YOUR_AUTH_KEY).
# 3. Create the host data folders once (owned by uid 1000):
#      sudo mkdir -p /srv/docker_data/retroshelf/{config,cache}
#      sudo chown -R 1000:1000 /srv/docker_data/retroshelf
#
# To build from source instead of pulling, use docker-compose.yml (Portainer's
# "Repository" method, pointed at this GitHub repo).

services:
  retroshelf:
    image: ghcr.io/caleb68864/retroshelf:${RETROSHELF_TAG:-latest}
    container_name: retroshelf
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8099}:8099"
    environment:
      - TZ=${TZ:-America/Chicago}
      - APP_PORT=8099
      # ── REQUIRED ── Kavita's internal service name + port and your OPDS key:
      - KAVITA_OPDS_URL=${KAVITA_OPDS_URL:?set KAVITA_OPDS_URL, e.g. http://kavita:5000/api/opds/YOUR_AUTH_KEY}
      # Optional — derived from the OPDS origin when unset:
      - KAVITA_BASE_URL=${KAVITA_BASE_URL:-}
      # Extra public libraries (Name|URL, comma-separated). Optional:
      - OPDS_FEEDS=${OPDS_FEEDS:-}
      # Optional hardening (leave blank to disable):
      - BRIDGE_ACCESS_KEY=${BRIDGE_ACCESS_KEY:-}
      - BRIDGE_ID_SECRET=${BRIDGE_ID_SECRET:-}
      - ALLOWED_IPS=${ALLOWED_IPS:-}
      - EXTRA_UPSTREAM_ORIGINS=${EXTRA_UPSTREAM_ORIGINS:-}
      # Behaviour:
      - SHOW_COVERS=${SHOW_COVERS:-true}
      - CACHE_FEEDS_SECONDS=${CACHE_FEEDS_SECONDS:-300}
      - CACHE_BOOKS=${CACHE_BOOKS:-false}
      - PDF_DISPOSITION=${PDF_DISPOSITION:-inline}
      - EPUB_DISPOSITION=${EPUB_DISPOSITION:-attachment}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ${CONFIG_DIR:-/srv/docker_data/retroshelf/config}:/config
      - ${CACHE_DIR:-/srv/docker_data/retroshelf/cache}:/cache
    networks:
      - kavita_net

networks:
  # Join Kavita's existing network (external: not created by this stack).
  kavita_net:
    external: true
    name: ${KAVITA_NETWORK:-kavita_default}
