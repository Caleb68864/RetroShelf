# RetroShelf — paste-into-Portainer stack (pulls a pre-built image, no build).
#
# Out of the box this fronts two PUBLIC libraries — ManyBooks and Project
# Gutenberg — so it works with ZERO configuration. Add your own Kavita library
# later (see "Adding Kavita later" below).
#
# Portainer → Stacks → Add stack → Web editor → paste this → Deploy.
# The image is public on GHCR, so no registry login is needed.
#
# ── One-time host setup (data folders, owned by uid 1000) ────────────────────
#     sudo mkdir -p /srv/docker_data/retroshelf/{config,cache}
#     sudo chown -R 1000:1000 /srv/docker_data/retroshelf
#   (Skip and it still runs, but the Reading List / download history won't persist.)
#
# ── Adding Kavita later ──────────────────────────────────────────────────────
#   1. Set KAVITA_OPDS_URL to your Kavita OPDS URL — it becomes the primary feed,
#      with ManyBooks + Gutenberg kept as extra libraries in the portal menu:
#        KAVITA_OPDS_URL=http://kavita:5000/api/opds/YOUR_AUTH_KEY
#   2. If Kavita runs as a Docker container on this host, RetroShelf must share
#      its network: UNCOMMENT the two `networks:` sections at the bottom and set
#      KAVITA_NETWORK to Kavita's network (find it with `docker network ls`); use
#      Kavita's INTERNAL service name + port in the URL above.
#      If Kavita is on another machine, just use its LAN IP in KAVITA_OPDS_URL —
#      no network changes needed.

services:
  retroshelf:
    image: ghcr.io/caleb68864/retroshelf:${RETROSHELF_TAG:-latest}
    container_name: retroshelf
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8099}:8099"
    environment:
      - TZ=${TZ:-America/Chicago}
      - APP_PORT=8099
      # Public libraries fronted by default (Name|URL pairs, comma-separated).
      # Edit/override via the OPDS_FEEDS env var in Portainer.
      - "OPDS_FEEDS=${OPDS_FEEDS:-ManyBooks|https://manybooks.net/opds, Project Gutenberg|https://www.gutenberg.org/ebooks.opds/}"
      # Your Kavita library — leave blank for now; set it later (becomes primary).
      - KAVITA_OPDS_URL=${KAVITA_OPDS_URL:-}
      - KAVITA_BASE_URL=${KAVITA_BASE_URL:-}
      # Optional hardening (leave blank to disable):
      - BRIDGE_ACCESS_KEY=${BRIDGE_ACCESS_KEY:-}
      - BRIDGE_ID_SECRET=${BRIDGE_ID_SECRET:-}
      - ALLOWED_IPS=${ALLOWED_IPS:-}
      - EXTRA_UPSTREAM_ORIGINS=${EXTRA_UPSTREAM_ORIGINS:-}
      # Behaviour:
      - SHOW_COVERS=${SHOW_COVERS:-true}
      - CACHE_FEEDS_SECONDS=${CACHE_FEEDS_SECONDS:-300}
      - CACHE_BOOKS=${CACHE_BOOKS:-false}
      - PDF_DISPOSITION=${PDF_DISPOSITION:-inline}
      - EPUB_DISPOSITION=${EPUB_DISPOSITION:-attachment}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ${CONFIG_DIR:-/srv/docker_data/retroshelf/config}:/config
      - ${CACHE_DIR:-/srv/docker_data/retroshelf/cache}:/cache
    # ── Uncomment when adding a Docker-hosted Kavita (see header) ──
    # networks:
    #   - kavita_net

# networks:
#   kavita_net:
#     external: true
#     name: ${KAVITA_NETWORK:-kavita_default}
