name: Tests

# The image workflow publishes to GHCR on every push to main. Nothing was
# checking that the code worked first. This runs the suite on every push and
# pull request so a broken bridge cannot reach anyone's Portainer stack.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Dockerfile ships. 3.14 is what the README's
        # bare-metal path gets: run.sh builds its venv from whatever `python3`
        # is, and on a current desktop distro that is 3.14 — the one path
        # nothing used to test. 3.13 sits between them and catches deprecations.
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
